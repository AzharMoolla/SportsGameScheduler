<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap');
:root{--page:#171b18;--surface:#212622;--cream:#f4ead8;--primary:#38e57d;--accent:#46e8ff;--gold:#ffc24b;--magenta:#ff4fd8;--red:#ff5247;--stub:#0b6f44}*{box-sizing:border-box}html,body{margin:0;background:var(--page);overflow:hidden}#card{position:relative;width:100vw;height:100vh;padding:6.4%;color:var(--cream);font-family:'Space Grotesk',sans-serif;overflow:hidden;background:radial-gradient(circle at 88% 6%,color-mix(in srgb,var(--primary) 13%,transparent),transparent 30%),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 5px),var(--page)}#card:before{content:"";position:absolute;inset:3.2%;border:1px solid color-mix(in srgb,var(--primary) 25%,transparent);pointer-events:none}.brand{position:relative;z-index:2;display:flex;align-items:center;gap:18px}.brand img{width:64px;height:64px}.brand strong{font:400 30px Bungee;color:var(--primary);letter-spacing:2px}.brand small,.kicker,.micro,.time,.cta{font-family:'IBM Plex Mono';letter-spacing:3px}.brand small{display:block;color:color-mix(in srgb,var(--cream) 55%,transparent);font-size:11px}.kicker{position:relative;z-index:2;margin-top:13%;color:var(--magenta);font-size:20px;font-weight:700}.headline{position:relative;z-index:2;margin:4% 0 0;max-width:94%;font:400 88px/.98 Bungee;color:var(--cream)}.headline em{color:var(--primary);font-style:normal}.body{position:relative;z-index:2;max-width:86%;margin-top:5%;font-size:30px;line-height:1.32;color:color-mix(in srgb,var(--cream) 80%,transparent)}.ticket{position:relative;z-index:2;margin-top:7%;display:grid;grid-template-columns:1fr auto;background:#f4ead8;color:#1d1812;border-radius:16px;overflow:hidden}.ticket-copy{padding:34px}.ticket-copy b{font:400 30px 'Archivo Black'}.ticket-copy p{margin:12px 0 0;font-size:20px}.stub{min-width:220px;padding:28px;display:grid;place-items:center;background:var(--stub);color:#fff3d7;border-left:3px dashed rgba(255,255,255,.38)}.stub span{font:700 32px 'IBM Plex Mono'}.flaps{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);margin-top:7%;border:1px solid color-mix(in srgb,var(--primary) 28%,transparent);background:var(--surface)}.flap{padding:24px 12px;text-align:center;border-right:1px solid color-mix(in srgb,var(--primary) 20%,transparent)}.flap:last-child{border:0}.flap small{display:block;color:#9ba9a0;font:500 13px 'IBM Plex Mono'}.flap b{display:block;margin-top:12px;font:700 26px 'IBM Plex Mono'}.bars{position:absolute;left:6.4%;bottom:8%;display:flex;gap:8px;height:92px}.bars i{display:block;width:16px}.bars i:nth-child(1){background:var(--primary)}.bars i:nth-child(2){background:var(--accent)}.bars i:nth-child(3){background:var(--gold)}.bars i:nth-child(4){background:var(--magenta)}.bars i:nth-child(5){background:var(--red)}.cta{position:absolute;z-index:2;right:6.4%;bottom:9%;font-size:20px;color:var(--primary);font-weight:700}.demo{position:relative;z-index:2;margin-top:6%;padding:32px;background:var(--surface);border:1px solid color-mix(in srgb,var(--primary) 26%,transparent)}.demo-label{color:var(--primary);font:700 16px 'IBM Plex Mono';letter-spacing:3px}.demo-row{display:flex;justify-content:space-between;padding:20px 0;border-bottom:1px solid color-mix(in srgb,var(--primary) 17%,transparent);font-size:25px}.demo-row b{font-family:'IBM Plex Mono';color:var(--accent)}[data-card="timezone"] .headline{font-size:90px}[data-card="worldcup"] .headline{font-size:82px}[data-card="worldcup"] .body{font-size:28px}[data-card="demo"] .headline{font-size:76px;margin-top:3%}[data-card="demo"] .kicker{margin-top:7%}@media(max-aspect-ratio:4/5){.headline{font-size:104px}.body{font-size:31px}.kicker{margin-top:16%}.ticket{margin-top:9%}.cta{font-size:24px}.brand strong{font-size:34px}}@media(max-aspect-ratio:9/16){#card{padding:7%}.brand img{width:74px;height:74px}.brand strong{font-size:38px}.kicker{margin-top:24%;font-size:22px}.headline,[data-card="timezone"] .headline,[data-card="worldcup"] .headline{font-size:106px}.body{font-size:34px;max-width:94%}.flaps{grid-template-columns:1fr 1fr}.flap:nth-child(2){border-right:0}.ticket{margin-top:12%;grid-template-columns:1fr}.stub{border-left:0;border-top:3px dashed rgba(255,255,255,.38)}.bars{left:7%;bottom:7%}.cta{right:7%;bottom:8%;font-size:25px}}
@media(min-aspect-ratio:3/2){#card{padding:5% 6.4%}.brand img{width:54px;height:54px}.brand strong{font-size:27px}.kicker,[data-card="demo"] .kicker{margin-top:6%;font-size:17px}.headline,[data-card="timezone"] .headline,[data-card="worldcup"] .headline,[data-card="demo"] .headline{margin-top:2.5%;font-size:66px;line-height:.98;max-width:82%}.body,[data-card="worldcup"] .body{margin-top:2.8%;font-size:22px;max-width:72%}.ticket{display:none}.demo{margin-top:4%;padding:22px}.demo-row{padding:12px 0;font-size:19px}.bars{bottom:7%;height:64px}.cta{bottom:8%;font-size:18px}}
</style></head><body><main id="card"><div class="brand"><img src="/public/favicon.svg" alt=""><div><strong>SILBO SPORTS</strong><small>EVERY GAME · MATCH · RACE · CARD</small></div></div><div id="content"></div><div class="bars"><i></i><i></i><i></i><i></i><i></i></div><div class="cta">SILBOSPORTS.COM →</div></main>
<script>
const cards={
timezone:`<p class="kicker">WHISTLE TO WHISTLE / IN YOUR TIMEZONE</p><h1 class="headline">NEVER DO<br>KICKOFF MATH<br><em>AGAIN.</em></h1><div class="flaps"><div class="flap"><small>TORONTO</small><b style="color:var(--primary)">8:00 PM</b></div><div class="flap"><small>VANCOUVER</small><b style="color:var(--accent)">5:00 PM</b></div><div class="flap"><small>LONDON</small><b style="color:var(--magenta)">1:00 AM</b></div><div class="flap"><small>TOKYO</small><b style="color:var(--gold)">9:00 AM</b></div></div><p class="body">Follow it. See it in local time. Put it in your calendar.</p>`,
schedule:`<p class="kicker">CH 00 / ALL SPORTS / ON AIR</p><h1 class="headline">ONE SCHEDULE<br>FOR EVERY SPORT<br><em>YOU FOLLOW.</em></h1><div class="demo"><div class="demo-label">MY SCHEDULE / TODAY</div><div class="demo-row"><span>⚽ World Cup · Canada vs France</span><b>2:00 PM</b></div><div class="demo-row"><span>🏎 Formula 1 · Qualifying</span><b style="color:var(--gold)">10:00 AM</b></div><div class="demo-row"><span>🥊 Championship main card</span><b style="color:var(--magenta)">11:30 PM</b></div></div>`,
worldcup:`<p class="kicker">CH 01 / WORLD CUP 2026 / LIVE NOW</p><h1 class="headline">BUILD YOUR<br>WORLD CUP<br><em>CALENDAR.</em></h1><p class="body">Pick your countries. See every kickoff in your timezone. Sync once. Never miss it.</p><div class="ticket"><div class="ticket-copy"><b>CANADA · TOURNAMENT PASS</b><p>Follow the country. Silbo fills in every match.</p></div><div class="stub"><span>ADMIT: WATCHING</span></div></div>`,
demo:`<p class="kicker">FOLLOW → LOCALIZE → SYNC</p><h1 class="headline">YOUR SPORTS.<br>YOUR TIME.<br><em>YOUR CALENDAR.</em></h1><div class="demo"><div class="demo-label">THE SILBO LOOP</div><div class="demo-row"><span>01 · Follow what matters</span><b>DONE</b></div><div class="demo-row"><span>02 · See every event locally</span><b>LOCAL</b></div><div class="demo-row"><span>03 · Sync your calendar</span><b style="color:var(--gold)">READY</b></div></div>`};
const q=new URLSearchParams(location.search);const key=q.get('card')||'timezone';const w=Number(q.get('w'))||1080;const h=Number(q.get('h'))||1080;const card=document.querySelector('#card');document.documentElement.style.width=document.body.style.width=card.style.width=`${w}px`;document.documentElement.style.height=document.body.style.height=card.style.height=`${h}px`;card.dataset.card=key;document.querySelector('#content').innerHTML=cards[key];document.fonts.ready.then(()=>document.body.dataset.ready='true');
</script></body></html>
