name: CI

# MOTHBALLED (2026-07): push/PR triggers disabled so no Actions minutes are consumed while the
# project is parked. Run manually from the Actions tab if you need a build check.
# TO RE-ENABLE: uncomment the `push:` and `pull_request:` blocks below.
on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=desktop-chromium
      - run: npm run build
