name: CI

# Resumed with the restored site. Hydration timers remain in Supabase, not Actions.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://bgbkqxdsjnbsizwkslsr.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_xGx8_YsoZZBCkbMrREPGug_39_9atJA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=desktop-chromium --workers=3
      - run: npm run build
